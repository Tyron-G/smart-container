server:
  port: 9960
  servlet:
    context-path: /order

spring:
  application:
    # 应用名称
    name: container-order

  profiles:
    active: dev

  cloud:
    nacos:
      discovery:
        #服务注册地址
        server-addr: localhost:8848
      config:
        #服务配置中心地址
        server-addr: localhost:8848
        file-extension: yaml
        group: CONTAINER_GROUP
        namespace: container-group
logging:
  level:
    root: info

miniapp:
  wechat:
    enabled: ${MINIAPP_WECHAT_ENABLED:false}
    local-test-mode: ${MINIAPP_WECHAT_LOCAL_TEST_MODE:true}
    app-id: ${MINIAPP_WECHAT_APP_ID:wx0650c1e3a558ae28}
    app-secret: ${MINIAPP_WECHAT_APP_SECRET:}
    jscode2-session-url: ${MINIAPP_WECHAT_JSCODE2_SESSION_URL:https://api.weixin.qq.com/sns/jscode2session}

