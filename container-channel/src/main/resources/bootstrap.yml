server:
  port: 9962
  servlet:
    context-path: /channel

spring:
  application:
    # 应用名称
    name: container-channel

  profiles:
    active: dev

  cloud:
    nacos:
      discovery:
        #服务注册地址
        server-addr: localhost:8848
      config:
        #服务配置中心地址
        server-addr: localhost:8848
        file-extension: yaml
        group: CONTAINER_GROUP
        namespace: container-group